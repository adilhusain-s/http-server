name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers the workflow on version tags (e.g., v1.0.0)

permissions:
  contents: write # Required for GitHub Actions to push release assets

jobs:
  release:
    name: Release with GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x" # Specify the Go version you want to use

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER_URL }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2" # Specifies the GoReleaser version
          args: release --clean # Arguments to pass to GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_SERVER_URL: ${{ secrets.REGISTRY_SERVER_URL }}
          REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
